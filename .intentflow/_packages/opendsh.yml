packageName: opendsh
summary: |
  VS Code 扩展：在编辑器内打开 DeepSeek Harness Web UI，一键起停 dsh web 服务。
  入口 extension.js，业务分三层 src/{manager,detect,process,webview}.js，单测 test/，零第三方依赖。
  薄壳启动器——不承担任何界面聚焦契约（?focus= 由 DSH 侧负责），打开方式完全由 settings 决定。
  移除 npx 兜底、启动去重、Output 诊断；
  启动方式单枚举 opendsh.launch.mode（integrated/window/hidden/window-keepalive/hidden-keepalive，
  枚举「输出载体 × 是否随 VS Code 存活」的有效组合，默认 integrated），
  Windows 独立存活经 WMI 脱离 VS Code 进程树；
  实验补丁 opendsh.experimental.windowsHidePatch 内嵌 src/patch.js（幂等改 DSH 源码抑制闪窗，仅 hidden-keepalive 生效）。
  双快捷入口——标题栏按钮（大写 D，contributes.menus.editor/title 声明，
  随标签栏显示）与状态栏按钮（代码注册，常驻可见，无标签页也能启动），点击均直接执行 opendsh.open；
  打开方式改为 webview 单例标签页（重复打开只聚焦不新建，关页不停服务）；
  启动自启（opendsh.autoStart 布尔设置，默认 true，onStartupFinished 激活后自动 open）；
  打开方式三选一（opendsh.openWith：tab 单例标签页 / simpleBrowser 内置浏览器 / systemBrowser 系统浏览器），
  纯 settings 决定，无面板、无状态记忆；
  聚焦模式与活动栏面板已移除（focus.js / buildFocusUrls / viewsContainers 均删除）；
  host/webviewHost 分离——host 用于 dsh 服务绑定与检测，webviewHost 仅用于 webview 内访问 URL
  （默认同 host，可设别名绕开 VS Code 对 localhost 的 service-worker 拦截）；
  多标签开放（opendsh.multipleTabs，默认 false，仅 tab 模式，每次打开新建标签页共享同一端口）；
  open 入口 300ms 防连点节流；
  webview 壳极简——iframe 直接加载目标 URL（带时间戳 cache-buster 绕缓存），无健康探测
  （服务就绪由 manager waitForPort 保证），CSP frame-src 用 origin（去 query），iframe fixed 撑满视口；
  manager 记录 serverStartedAt，面板创建早于最近一次服务启动时 open 强制重设 html（旧页面滞留自愈）。

groups:
  - name: DSH 起停与打开
    summary: 命令/深链/标题栏与状态栏入口 + 生命周期编排 + 自动检索 + 跨平台进程 + webview 承载，
      共同构成「打开 + 起停」能力；manager 负责启动去重、pid 持久化（.dsh/opendsh.pid）、
      webview 单例标签页（复用/重载/关页清引用）与关闭钩子（deactivate→dispose）；
      打开方式按 settings.openWith 分叉（tab/simpleBrowser/systemBrowser），无面板/无聚焦承载；
      启动参数收敛为最小稳定集（web / --patch 可选 / --host 非默认才传 / --port / --no-open），禁 dsh 自开浏览器由 opendsh 控制打开方式；
      dsh 定位 = dshPath 设置 > PATH 的 dsh 命令（npm shim）> npm 全局真实入口（读 package.json bin 字段）；
      stop 后残窗内 open 等待端口释放再启动（区分残留旧进程与外部 dsh），修手动 Stop→Open 悬置；
      launch.mode 五模式分发（integrated/window/hidden 走终端/桌面窗口/静默 spawn、*-keepalive 走 WMI 独立存活）、
      hidden-keepalive+windowsHidePatch 经 src/patch.js 幂等补丁；包含调试日志用于追踪配置读取和执行流程。
    files:
      - extension.js
      - src/manager.js
      - src/detect.js
      - src/process.js
      - src/webview.js
      - src/patch.js
      - media/dsh-activity.svg
  - name: 单元测试
    summary: node:test 覆盖 detect/process/manager/webview/patch 五个模块（含 dsh 定位优先级、端口释放等待、WMI 独立启动、
      pid 残留停止、webview 单例创建/复用/重载/关页重建/创建失败回退、打开方式分叉、补丁定位/幂等）
    files:
      - test/detect.test.js
      - test/process.test.js
      - test/manager.test.js
      - test/webview.test.js
      - test/patch.test.js
  - name: 运维补丁与发布辅助
    summary: 非运行时资产——DSH Windows 子进程窗口补丁脚本（幂等、可重跑）、上游 issue 草案与 .vscodeignore
      打包排除规则，便于本机修复 DSH 弹窗、发布 vsix 后维护；不入 vsix 包。
    files:
      - scripts/patch-dsh-windows-hide.mjs
      - docs/dsh-windows-console-window-issue.md
      - .vscodeignore
  - name: 扩展声明与用户文档
    summary: package.json（命令 opendsh.open / opendsh.stop、标题栏菜单、设置键声明）与 README（中英用户文档），
      构成扩展的对外声明层；与运行时 src/ 分离但必须同步——命令 ID、设置键、版本号任一变更须同改这两份。
      opendsh.launch.mode / opendsh.experimental.windowsHidePatch 是嵌套设置键（readSettings 用点式键读取），
      openWith 纯 settings 决定（无面板、无状态记忆）。
    files:
      - package.json
      - README.md
