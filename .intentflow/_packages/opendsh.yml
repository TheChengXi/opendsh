packageName: opendsh
summary: |
  VS Code 扩展：在编辑器内打开 DeepSeek Harness Web UI，一键起停 dsh web 服务。
  入口 extension.js，业务分三层 src/{manager,detect,process,webview}.js，单测 test/，零第三方依赖。
  移除 npx 兜底、启动去重、Output 诊断、静默/窗口可配置、
  Windows 独立存活经 WMI 脱离 VS Code 进程树（detached=true）。
  双快捷入口——标题栏按钮（大写 D，contributes.menus.editor/title 声明，
  随标签栏显示）与状态栏按钮（代码注册，常驻可见，无标签页也能启动），点击均直接执行 opendsh.open；
  打开方式改为 webview 单例标签页（重复打开只聚焦不新建，关页不停服务）；
  启动自启（opendsh.autoStart 布尔设置，默认 true，onStartupFinished 激活后自动 open）；
  打开方式四选一（opendsh.openWith：tab 单例标签页 / simpleBrowser 内置浏览器 / systemBrowser 系统浏览器
  / focus 聚焦模式——对话进 VS Code 侧栏视图 opendsh.dsh-chat + 输入区留主编辑区 webview，
  经 ?focus=conversation / ?focus=composer URL 契约对接 DSH 侧聚焦插件，主视野留给代码；
  focus 的实际界面隔离由独立交付物 @dsh-focus/focus-plugin 提供——DSH client 插件（纯 CSS 隐藏方案：
  隐藏另一窗口与大侧栏），安装于 ~/.dsh/profiles/node_modules/@dsh-focus/focus-plugin，
  经 .dsh/dsh.mcp.patch.yml 的 insert（name 必须精确等于包名）挂载进 dsh 插件树）；
  多标签开放（opendsh.multipleTabs，默认 false，仅 tab 模式，每次打开新建标签页共享同一端口）；
  open 入口 300ms 防连点节流；
  webview 壳带时间戳 cache-buster（每次打开全新 iframe URL，绕开浏览器缓存回退旧 HTML）+ 健康探测重试
  （no-cors fetch 探测 server 监听，退避重试上限 60 次，就绪后才赋值 iframe src）；
  manager 记录 serverStartedAt，面板创建早于最近一次服务启动时 open 强制重设 html（旧页面滞留自愈）。

groups:
  - name: DSH 起停与打开
    summary: 命令/深链/标题栏与状态栏入口 + 生命周期编排 + 自动检索 + 跨平台进程 + webview 承载，
      共同构成「打开 + 起停」能力；manager 负责启动去重、pid 持久化（.dsh/opendsh.pid）、
      webview 单例标签页（复用/重载/关页清引用）与关闭钩子（deactivate→dispose）；
      openWith=focus 时 manager 委托 focus 编排器打开「侧栏对话视图 + 主编辑区输入 webview」双承载面
    files:
      - extension.js
      - src/manager.js
      - src/detect.js
      - src/focus.js
      - src/process.js
      - src/webview.js
      - media/dsh-activity.svg
  - name: 单元测试
    summary: node:test 覆盖 detect/process/manager/webview/focus 五个模块（含 npm 全局定位、WMI 独立启动、
      pid 残留停止、webview 单例创建/复用/重载/关页重建/创建失败回退、focus 双承载面注册/复用/重建/reset）
    files:
      - test/detect.test.js
      - test/process.test.js
      - test/manager.test.js
      - test/webview.test.js
      - test/focus.test.js
  - name: 运维补丁与发布辅助
    summary: 非运行时资产——DSH Windows 子进程窗口补丁脚本（幂等、可重跑）、上游 issue 草案与 .vscodeignore
      打包排除规则，便于本机修复 DSH 弹窗、发布 vsix 后维护；不入 vsix 包。
    files:
      - scripts/patch-dsh-windows-hide.mjs
      - docs/dsh-windows-console-window-issue.md
      - .vscodeignore

